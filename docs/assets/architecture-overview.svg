<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
<title id="title">ForgeOps conceptual architecture</title>
<desc id="desc">A proposed self-hosted platform architecture showing public demo and operator dashboard, a modular monolith control plane, PostgreSQL, Temporal workflow orchestration, separate workers, and customer infrastructure.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151b32"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d28d9"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#93a4c7"/></marker>
  <style>
    .h1{font:700 34px Inter,Arial,sans-serif;fill:#f8fafc}.sub{font:400 16px Inter,Arial,sans-serif;fill:#aab6d1}
    .lane{fill:#111a30;stroke:#30405f;stroke-width:1.5}.laneTitle{font:700 19px Inter,Arial,sans-serif;fill:#dbeafe;letter-spacing:.4px}
    .card{fill:#1b2945;stroke:#40577f;stroke-width:1.3}.cardBlue{fill:#172e54;stroke:#3b82f6;stroke-width:1.5}.cardPurple{fill:#2b2050;stroke:#8b5cf6;stroke-width:1.5}.cardGreen{fill:#123b3a;stroke:#14b8a6;stroke-width:1.5}.cardAmber{fill:#3c2c17;stroke:#f59e0b;stroke-width:1.5}
    .label{font:700 17px Inter,Arial,sans-serif;fill:#f8fafc}.small{font:400 13px Inter,Arial,sans-serif;fill:#c1cce2}.tiny{font:400 11px Inter,Arial,sans-serif;fill:#9fb0cf}
    .arrow{fill:none;stroke:#93a4c7;stroke-width:2.2;marker-end:url(#arrow)}.dashed{fill:none;stroke:#60769d;stroke-width:1.5;stroke-dasharray:7 7}
  </style>
</defs>
<rect width="1440" height="1050" rx="24" fill="url(#bg)"/>
<text x="56" y="66" class="h1">ForgeOps · Conceptual System Architecture</text>
<text x="56" y="98" class="sub">Proposed design — self-hosted control plane, durable workflows and isolated execution workers</text>

<!-- Presentation -->
<rect x="56" y="130" width="1328" height="118" rx="18" class="lane"/>
<text x="80" y="160" class="laneTitle">PRESENTATION LAYER</text>
<rect x="82" y="178" width="570" height="48" rx="10" class="cardBlue"/>
<text x="367" y="208" text-anchor="middle" class="label">Public read-only demo · seeded data only</text>
<rect x="788" y="178" width="570" height="48" rx="10" class="cardPurple"/>
<text x="1073" y="208" text-anchor="middle" class="label">Operator dashboard · authenticated workspace</text>

<path d="M367 248 V276 H720 V298" class="arrow"/>
<path d="M1073 248 V276 H720" class="arrow"/>

<!-- Control plane -->
<rect x="56" y="298" width="1328" height="292" rx="18" class="lane"/>
<text x="80" y="332" class="laneTitle">CONTROL PLANE · MODULAR MONOLITH (NESTJS)</text>
<rect x="82" y="356" width="220" height="190" rx="12" class="cardBlue"/>
<text x="192" y="390" text-anchor="middle" class="label">API Layer</text>
<text x="192" y="422" text-anchor="middle" class="small">Authentication</text>
<text x="192" y="446" text-anchor="middle" class="small">Authorization · Validation</text>
<text x="192" y="470" text-anchor="middle" class="small">Rate limits · API contracts</text>
<text x="192" y="514" text-anchor="middle" class="tiny">Entry point for user actions</text>

<rect x="326" y="356" width="720" height="190" rx="12" class="card"/>
<text x="686" y="383" text-anchor="middle" class="label">Business modules with explicit boundaries</text>
<g>
  <rect x="348" y="400" width="160" height="54" rx="9" class="cardBlue"/><text x="428" y="433" text-anchor="middle" class="small">Identity &amp; Orgs</text>
  <rect x="520" y="400" width="160" height="54" rx="9" class="cardPurple"/><text x="600" y="433" text-anchor="middle" class="small">Projects</text>
  <rect x="692" y="400" width="160" height="54" rx="9" class="cardGreen"/><text x="772" y="433" text-anchor="middle" class="small">Workflows</text>
  <rect x="864" y="400" width="160" height="54" rx="9" class="cardAmber"/><text x="944" y="433" text-anchor="middle" class="small">Deployments</text>
  <rect x="348" y="472" width="160" height="54" rx="9" class="cardPurple"/><text x="428" y="505" text-anchor="middle" class="small">Integrations</text>
  <rect x="520" y="472" width="160" height="54" rx="9" class="cardBlue"/><text x="600" y="505" text-anchor="middle" class="small">AI Gateway</text>
  <rect x="692" y="472" width="160" height="54" rx="9" class="cardGreen"/><text x="772" y="505" text-anchor="middle" class="small">Approvals</text>
  <rect x="864" y="472" width="160" height="54" rx="9" class="card"/><text x="944" y="505" text-anchor="middle" class="small">Audit &amp; Policy</text>
</g>
<rect x="1070" y="356" width="288" height="190" rx="12" class="cardGreen"/>
<text x="1214" y="390" text-anchor="middle" class="label">PostgreSQL</text>
<text x="1214" y="422" text-anchor="middle" class="small">Shared database instance</text>
<text x="1214" y="446" text-anchor="middle" class="small">Logical ownership per module</text>
<text x="1214" y="486" text-anchor="middle" class="tiny">Business data · run metadata</text>
<text x="1214" y="508" text-anchor="middle" class="tiny">credentials stored encrypted</text>
<path d="M302 450 H326" class="arrow"/>
<path d="M1046 450 H1070" class="arrow"/>

<!-- Orchestration -->
<path d="M686 590 V622" class="arrow"/>
<rect x="250" y="622" width="940" height="96" rx="16" class="cardPurple"/>
<text x="720" y="662" text-anchor="middle" class="label">Temporal · durable workflow orchestration</text>
<text x="720" y="690" text-anchor="middle" class="small">Workflow state · timers · retries · timeouts · recovery after process restarts</text>

<!-- Workers -->
<path d="M720 718 V748" class="arrow"/>
<rect x="56" y="748" width="1328" height="154" rx="18" class="lane"/>
<text x="80" y="781" class="laneTitle">EXECUTION PLANE · SEPARATELY SCALABLE WORKERS</text>
<rect x="82" y="804" width="292" height="72" rx="11" class="cardBlue"/>
<text x="228" y="834" text-anchor="middle" class="label">Deployment Worker</text><text x="228" y="856" text-anchor="middle" class="tiny">build · scan · deploy · verify</text>
<rect x="392" y="804" width="292" height="72" rx="11" class="cardGreen"/>
<text x="538" y="834" text-anchor="middle" class="label">Monitoring Worker</text><text x="538" y="856" text-anchor="middle" class="tiny">checks · signals · alerts</text>
<rect x="702" y="804" width="292" height="72" rx="11" class="cardAmber"/>
<text x="848" y="834" text-anchor="middle" class="label">Backup Worker</text><text x="848" y="856" text-anchor="middle" class="tiny">backup · verify · restore test</text>
<rect x="1012" y="804" width="346" height="72" rx="11" class="cardPurple"/>
<text x="1185" y="834" text-anchor="middle" class="label">AI Analysis Worker</text><text x="1185" y="856" text-anchor="middle" class="tiny">summaries · suggestions · RAG</text>

<!-- External systems -->
<path d="M720 902 V930" class="arrow"/>
<rect x="56" y="930" width="1328" height="82" rx="16" class="card"/>
<text x="720" y="960" text-anchor="middle" class="label">Connected systems and customer infrastructure</text>
<text x="720" y="987" text-anchor="middle" class="small">Git provider · Docker hosts · Kubernetes clusters · databases · metrics and log systems</text>
<text x="1380" y="1034" text-anchor="end" class="tiny">Concept illustration · not an implemented or deployed system</text>
</svg>
